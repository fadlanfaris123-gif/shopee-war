<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; margin: 0; }
  .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  h2 { text-align: center; color: #ff5722; margin-bottom: 20px; font-size: 24px; letter-spacing: 1px; }
  .form-group { margin-bottom: 15px; }
  label { display: block; font-size: 13px; color: #b3b3b3; margin-bottom: 5px; }
  input, select { width: 100%; padding: 12px; background: #2b2b2b; border: 1px solid #444; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
  input:focus, select:focus { border-color: #ff5722; outline: none; }
  .row { display: flex; gap: 10px; }
  .row .form-group { flex: 1; }
  button { width: 100%; padding: 15px; background: linear-gradient(90deg, #ff5722, #ff9800); color: #fff; border: none; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 20px; cursor: pointer; transition: 0.3s; }
  button:active { transform: scale(0.98); }
  #status { margin-top: 15px; text-align: center; color: #4caf50; font-weight: bold; font-size: 14px; }
</style>
</head>
<body>
  <div class="container">
      <h2>ShopeeWar Pro</h2>
      
      <div class="form-group">
          <label>Link Barang Shopee</label>
          <input id="url" type="url" placeholder="https://shopee.co.id/...">
      </div>

      <div class="row">
          <div class="form-group">
              <label>Target Harga (Rp)</label>
              <input id="price" type="number" placeholder="1000">
          </div>
          <div class="form-group">
              <label>Jumlah Beli</label>
              <input id="qty" type="number" value="1">
          </div>
      </div>

      <div class="form-group">
          <label>Metode Pembayaran</label>
          <select id="payment">
              <option value="COD">COD (Bayar di Tempat)</option>
              <option value="ShopeePay">ShopeePay (Saldo)</option>
              <option value="Bank">Transfer Bank</option>
          </select>
      </div>

      <div class="form-group">
          <label>Pilih Kurir</label>
          <select id="courier">
              <option value="Reguler">Reguler (J&T / SiCepat)</option>
              <option value="Instan">Instan (GoSend / GrabExpress)</option>
              <option value="Kargo">Kargo (Pengiriman Besar)</option>
          </select>
      </div>

      <div class="form-group">
          <label>Jam Eksekusi Checkout</label>
          <input id="time" type="datetime-local">
      </div>

      <button onclick="simpan()">START BOT SEKARANG</button>
      <div id="status"></div>
  </div>

  <script>
    function simpan() {
      var url = document.getElementById('url').value;
      var price = document.getElementById('price').value;
      var time = document.getElementById('time').value;

      if(!url || !price || !time) {
          document.getElementById('status').innerText = "Isi semua data dengan benar!";
          document.getElementById('status').style.color = "red";
          return;
      }

      var cfg = {
        url: url,
        price: parseInt(price),
        qty: parseInt(document.getElementById('qty').value),
        payment: document.getElementById('payment').value,
        courier: document.getElementById('courier').value,
        time: time.replace('T', ' ') + ':00'
      };
      
      var jsonStr = JSON.stringify(cfg);
      
      if (window.Android) {
          window.Android.simpanKonfigurasi(jsonStr);
          document.getElementById('status').innerText = 'Bot Siap! Silakan jalankan Termux.';
          document.getElementById('status').style.color = "#4caf50";
      } else {
          localStorage.setItem('cfg', jsonStr);
          document.getElementById('status').innerText = 'Tersimpan di browser.';
      }
    }
  </script>
</body>
</html>
